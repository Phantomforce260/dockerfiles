services:
    helper:
        container_name: suwayomi-helper
        restart: unless-stopped

        image: ${LF_GIT}/apps/suwayomi/helper:latest

        ports:
            - "8014:8080"

        volumes:
            # Manifest (localSource.json) and MangaDex id overrides (.mangadex_ids.json).
            - ./data/helper:/app/data/helper
            # Suwayomi data dir, shared with the suwayomi server container.
            - ${HDD_MNTS}/suwayomi:/app/data/suwayomi
